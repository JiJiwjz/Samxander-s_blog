:root {
  --bg: #fcfbfe;
  --cobalt: #142cbf;
  --blue: #1551c3;
  --ink: #103986;
  --border: #d2e1f8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #f2f5fb;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: "Manrope", "Inter Display", "Inter", "Helvetica Neue", Arial, sans-serif;
}

.cover {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  background: var(--bg);
  overflow: hidden;
  display: grid;
  place-items: center;
  box-shadow: 0 1.25vw 3.645833vw rgba(16, 57, 134, 0.08);
}

.waves {
  position: absolute;
  inset: -2% -4%;
  width: 108%;
  height: 104%;
  pointer-events: none;
  z-index: 0;
  animation: waveDrift 12s ease-in-out infinite alternate;
}

@keyframes waveDrift {
  0%   { transform: translate3d(-1.2%, 0.4%, 0); }
  100% { transform: translate3d(1.2%, -0.6%, 0); }
}

/* Register the split so a single interpolated percentage drives both image layers. */
@property --split {
  syntax: '<percentage>';
  inherits: true;
  initial-value: 78%;
}

/* Two cubic halves give the original 4t³ / (1 − 4(1 − t)³) easing. */
@keyframes splitCycle {
  0%, 100% { --split: 78%; }
  10% { --split: 78%; animation-timing-function: cubic-bezier(.333333, 0, .666667, 0); }
  30% { --split: 48%; animation-timing-function: cubic-bezier(.333333, 1, .666667, 1); }
  50% { --split: 18%; }
  60% { --split: 18%; animation-timing-function: cubic-bezier(.333333, 0, .666667, 0); }
  80% { --split: 48%; animation-timing-function: cubic-bezier(.333333, 1, .666667, 1); }
}

@keyframes riseIn {
  0%   { opacity: 0; transform: translateY(1.145833cqw); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes ruleGrow {
  0%   { opacity: 0; transform: scaleX(0); }
  100% { opacity: 1; transform: scaleX(1); }
}

@keyframes cardIn {
  0%   { opacity: 0; transform: translateY(0.9375cqw) scale(0.965); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Centered, tightly grouped focal stage */
.stage {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4.2cqw;
  max-width: 84%;
}

.title-col {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.mark {
  display: inline-flex;
  align-items: flex-start;
  line-height: 0.82;
  margin-bottom: 1.8cqw;
  user-select: none;
  opacity: 0;
  animation: riseIn 0.72s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards;
}

.mark-r {
  font-family: "Bricolage Grotesque", "Inter Display", "Manrope", sans-serif;
  font-weight: 800;
  font-size: 13.6cqw;
  letter-spacing: -0.04em;
  color: var(--cobalt);
}

.mark-sup {
  font-family: "Bricolage Grotesque", "Inter Display", "Manrope", sans-serif;
  font-weight: 800;
  font-size: 6.3cqw;
  line-height: 0.9;
  color: var(--blue);
  margin-left: 0.06em;
  margin-top: -0.04em;
}

h1 {
  font-family: "Bricolage Grotesque", "Inter Display", "Manrope", sans-serif;
  font-weight: 760;
  font-size: 5.15cqw;
  line-height: 1.07;
  letter-spacing: -0.032em;
  color: var(--cobalt);
  white-space: nowrap;
  opacity: 0;
  animation: riseIn 0.72s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
}

.accent-rule {
  width: 4.6cqw;
  height: 0.38cqw;
  border-radius: 999px;
  background: var(--blue);
  margin: 1.7cqw 0 1.5cqw;
  transform-origin: left center;
  opacity: 0;
  animation: ruleGrow 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.38s forwards;
}

.subtitle {
  font-family: "Manrope", "Inter", sans-serif;
  font-weight: 600;
  font-size: 2.38cqw;
  line-height: 1.25;
  letter-spacing: -0.015em;
  color: var(--ink);
  white-space: nowrap;
  opacity: 0;
  animation: riseIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.48s forwards;
}

/* Compact right-side comparison frame with smooth animated split */
.compare {
  position: relative;
  width: 34.5cqw;
  aspect-ratio: 1 / 1.04;
  flex-shrink: 0;
  border-radius: 1.35cqw;
  overflow: hidden;
  border: 0.078125cqw solid var(--border);
  box-shadow: 0 1.041667cqw 2.291667cqw rgba(16, 57, 134, 0.13);
  user-select: none;
  pointer-events: none;
  --split: 78%;
  opacity: 0;
  animation:
    cardIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.24s forwards,
    splitCycle 2s linear 0.35s infinite;
}

.compare img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  display: block;
}

.compare .layer-hazy {
  clip-path: inset(0 calc(100% - var(--split)) 0 0);
  will-change: clip-path;
}

.divider {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--split);
  width: 0.15625cqw;
  transform: translateX(-50%);
  background: #ffffff;
  box-shadow: 0 0 0.729167cqw rgba(16, 57, 134, 0.28);
  pointer-events: none;
  will-change: left;
}

.handle {
  position: absolute;
  top: 50%;
  left: var(--split);
  width: 2.5cqw;
  height: 2.5cqw;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #ffffff;
  box-shadow:
    inset 0 0 0 0.125cqw var(--cobalt),
    0 0.3125cqw 0.8333cqw rgba(16, 57, 134, 0.22);
  display: grid;
  place-items: center;
  pointer-events: none;
  will-change: left;
}

.handle svg {
  width: 56%;
  height: 56%;
  stroke: var(--cobalt);
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@media (prefers-reduced-motion: reduce) {
  .waves, .mark, h1, .accent-rule, .subtitle, .compare {
    animation: none;
    opacity: 1;
  }
  .compare { --split: 48%; }
}
</style>
</head>
